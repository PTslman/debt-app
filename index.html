<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>📊 دفتر الديون</title>
    <link rel="stylesheet" href="css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
    <!-- رأس التطبيق -->
    <header class="app-header">
        <div class="header-content">
            <div class="header-title">
                <i class="fas fa-book-open"></i>
                <h1>دفتر الديون</h1>
            </div>
            <div class="header-actions">
                <button onclick="exportBackup()" class="icon-btn" title="نسخة احتياطية">
                    <i class="fas fa-download"></i>
                </button>
                <button onclick="importBackup()" class="icon-btn" title="استعادة">
                    <i class="fas fa-upload"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="main-content">
        <!-- إحصائيات سريعة -->
        <div class="stats-bar">
            <div class="stat-card">
                <span class="stat-number" id="totalPersons">0</span>
                <span class="stat-label">👥 أشخاص</span>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="totalDebts">0</span>
                <span class="stat-label">📝 ديون</span>
            </div>
        </div>

        <!-- قائمة الأشخاص -->
        <section class="persons-section">
            <div class="section-header">
                <h2><i class="fas fa-users"></i> العملاء</h2>
                <span class="badge-count" id="personsCount">0</span>
            </div>
            <div id="personsContainer" class="persons-grid"></div>
        </section>
    </main>

    <!-- زر إضافة عائم (FAB) -->
    <button id="fabAddPerson" class="fab-button" onclick="openAddPersonModal()">
        <i class="fas fa-plus"></i>
    </button>

    <!-- مودال إضافة شخص -->
    <div id="addPersonModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-user-plus"></i> إضافة شخص جديد</h3>
                <button class="modal-close" onclick="closeAddPersonModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="input-group-modal">
                    <label>اسم الشخص</label>
                    <input type="text" id="personNameInput" placeholder="أدخل اسم العميل..." />
                </div>
                <button onclick="addPerson()" class="btn-save-person">
                    <i class="fas fa-save"></i> حفظ
                </button>
                <div id="addPersonMessage" class="message-box"></div>
            </div>
        </div>
    </div>

    <!-- مودال تفاصيل الشخص -->
    <div id="personDetailsModal" class="modal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h3 id="selectedPersonName"><i class="fas fa-user"></i> </h3>
                <button class="modal-close" onclick="closePersonDetails()">&times;</button>
            </div>
            <div class="modal-body">
                <!-- إحصائيات العميل -->
                <div class="client-stats">
                    <div class="client-stat">
                        <span class="stat-label-small">عدد الديون</span>
                        <span class="stat-number-small" id="clientDebtCount">0</span>
                    </div>
                    <div class="client-stat">
                        <span class="stat-label-small">إجمالي المبلغ</span>
                        <span class="stat-number-small" id="clientTotalAmount">0</span>
                        <span class="currency-small">ل.س</span>
                    </div>
                </div>

                <!-- نموذج إضافة دين -->
                <div class="add-debt-section">
                    <h4><i class="fas fa-plus-circle"></i> إضافة دين</h4>
                    <div class="debt-form-row">
                        <div class="debt-input-group">
                            <label>المبلغ (ل.س)</label>
                            <input type="number" id="debtAmountInput" placeholder="0" />
                        </div>
                        <div class="debt-input-group">
                            <label>التاريخ</label>
                            <input type="date" id="debtDateInput" />
                        </div>
                        <button onclick="addDebt()" class="btn-add-debt-small">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                    <div id="debtMessage" class="message-box"></div>
                </div>

                <!-- جدول الديون -->
                <div class="debts-list">
                    <h4><i class="fas fa-list"></i> سجل الديون</h4>
                    <div id="debtsContainer" class="debts-list-items"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- مودال تأكيد الحذف -->
    <div id="confirmModal" class="modal">
        <div class="modal-content modal-small">
            <div class="modal-header">
                <h3><i class="fas fa-exclamation-triangle" style="color:#fc8181;"></i> تأكيد الحذف</h3>
            </div>
            <div class="modal-body">
                <p id="confirmMessage">هل أنت متأكد من حذف هذا العنصر؟</p>
                <div class="confirm-actions">
                    <button onclick="confirmDelete()" class="btn-confirm-delete">
                        <i class="fas fa-trash"></i> حذف
                    </button>
                    <button onclick="closeConfirmModal()" class="btn-confirm-cancel">
                        إلغاء
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- تنبيهات -->
    <div id="toastContainer"></div>

    <!-- Firebase Scripts -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"
            }
        }
    </script>

    <script type="module">
        import { db } from './js/firebase-config.js';
        import { 
            collection, addDoc, getDocs, deleteDoc, doc, 
            updateDoc, query, where, onSnapshot 
        } from "firebase/firestore";

        window.db = db;
        window.collection = collection;
        window.addDoc = addDoc;
        window.getDocs = getDocs;
        window.deleteDoc = deleteDoc;
        window.doc = doc;
        window.updateDoc = updateDoc;
        window.query = query;
        window.where = where;
        window.onSnapshot = onSnapshot;
    </script>

    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/backup.js"></script>
</body>
</html>
