<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>📊 دفتر الديون</title>
    <link rel="stylesheet" href="css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

    <!-- HEADER -->
    <header class="app-header">
        <div class="header-content">
            <div class="header-left">
                <i class="fas fa-book-open header-icon"></i>
                <div>
                    <h1>دفتر الديون</h1>
                    <span class="header-subtitle">💾 سحابي بالكامل</span>
                </div>
            </div>
            <div class="header-actions">
                <button id="btnRefresh" class="header-btn" title="تحديث"><i class="fas fa-sync-alt"></i></button>
                <button id="btnBackup" class="header-btn" title="نسخة احتياطية"><i class="fas fa-cloud-download-alt"></i></button>
                <button id="btnRestore" class="header-btn" title="استعادة"><i class="fas fa-cloud-upload-alt"></i></button>
            </div>
        </div>
    </header>

    <!-- SEARCH -->
    <div class="search-bar">
        <div class="search-container">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="searchInput" placeholder="🔍 بحث عن عميل..." />
            <button id="btnClearSearch" class="clear-search" style="display:none;"><i class="fas fa-times-circle"></i></button>
        </div>
    </div>

    <!-- STATS -->
    <div class="stats-container">
        <div class="stat-item"><span class="stat-number" id="totalPersons">0</span><span class="stat-label">👥 عملاء</span></div>
        <div class="stat-divider"></div>
        <div class="stat-item"><span class="stat-number" id="totalDebts">0</span><span class="stat-label">📝 ديون</span></div>
        <div class="stat-divider"></div>
        <div class="stat-item"><span class="stat-number" id="totalAmount">0</span><span class="stat-label">💰 ل.س</span></div>
    </div>

    <!-- LOADING -->
    <div id="loadingIndicator" class="loading-indicator" style="display:none;">
        <i class="fas fa-spinner fa-spin"></i><span>جاري التحميل...</span>
    </div>

    <!-- PERSONS LIST -->
    <div class="chat-list" id="chatList">
        <div class="empty-state">
            <i class="fas fa-users empty-icon"></i>
            <h3>لا يوجد عملاء</h3>
            <p>اضغط على زر + لإضافة عميل جديد</p>
        </div>
    </div>

    <!-- FAB -->
    <button id="fabAddPerson" class="fab-button"><i class="fas fa-plus"></i></button>

    <!-- MODAL: ADD PERSON -->
    <div id="personModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle"><i class="fas fa-user-plus"></i> عميل جديد</h3>
                <button class="modal-close" id="closePersonModal"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>اسم العميل <span class="required">*</span></label>
                    <div class="input-with-icon">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" id="personNameInput" placeholder="أدخل اسم العميل..." maxlength="100" />
                    </div>
                </div>
                <div class="form-group">
                    <label>المبلغ (ل.س) <span class="required">*</span></label>
                    <div class="input-with-icon">
                        <i class="fas fa-money-bill-wave input-icon"></i>
                        <input type="number" id="personAmountInput" placeholder="0" min="0" step="1" />
                    </div>
                </div>
                <div class="form-group">
                    <label>التاريخ <span class="required">*</span></label>
                    <div class="input-with-icon">
                        <i class="fas fa-calendar-alt input-icon"></i>
                        <input type="date" id="personDateInput" />
                    </div>
                </div>
                <button id="btnSavePerson" class="btn-save"><i class="fas fa-save"></i> حفظ</button>
                <div id="personMessage" class="message-box"></div>
            </div>
        </div>
    </div>

    <!-- MODAL: CLIENT DETAILS -->
    <div id="clientModal" class="modal modal-full">
        <div class="modal-content modal-large">
            <div class="modal-header client-header">
                <div class="client-header-info">
                    <div class="client-avatar-large" id="clientAvatar">أ</div>
                    <div>
                        <h3 id="clientName">أحمد</h3>
                        <span class="client-subtitle" id="clientDebtCount">0 ديون</span>
                    </div>
                </div>
                <div class="client-header-actions">
                    <button id="btnEditClient" class="header-btn-icon" title="تعديل"><i class="fas fa-edit"></i></button>
                    <button id="btnDeleteClient" class="header-btn-icon" title="حذف"><i class="fas fa-trash"></i></button>
                    <button class="modal-close" id="closeClientModal"><i class="fas fa-arrow-left"></i></button>
                </div>
            </div>
            <div class="modal-body">
                <div class="client-total-card">
                    <div>
                        <span class="total-label">إجمالي الديون</span>
                        <span class="total-amount" id="clientTotalAmount">0</span>
                        <span class="total-currency">ل.س</span>
                    </div>
                </div>
                <div class="add-debt-card">
                    <div class="debt-form">
                        <div class="debt-input">
                            <input type="number" id="debtAmountInput" placeholder="💵 المبلغ" min="0" step="1" />
                        </div>
                        <div class="debt-input">
                            <input type="date" id="debtDateInput" />
                        </div>
                        <button id="btnAddDebt" class="btn-add-debt"><i class="fas fa-plus"></i></button>
                    </div>
                    <div id="debtMessage" class="message-box"></div>
                </div>
                <div class="debts-list">
                    <h4><i class="fas fa-list"></i> سجل الديون</h4>
                    <div id="debtsContainer" class="debts-items"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: CONFIRM -->
    <div id="confirmModal" class="modal">
        <div class="modal-content modal-small">
            <div class="modal-header">
                <h3><i class="fas fa-exclamation-triangle" style="color:#fc8181;"></i> تأكيد</h3>
                <button class="modal-close" id="closeConfirmModalBtn"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <p id="confirmMessage">هل أنت متأكد؟</p>
                <div class="confirm-actions">
                    <button id="btnConfirmDelete" class="btn-danger"><i class="fas fa-trash"></i> حذف</button>
                    <button id="btnConfirmCancel" class="btn-secondary">إلغاء</button>
                </div>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toastContainer"></div>

    <!-- FIREBASE -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"
            }
        }
    </script>

    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/backup.js"></script>
    <script type="module" src="js/app.js"></script>

</body>
</html>
